<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Story Hub هو موقع احترافي للألعاب والتحديثات والأخبار والمساعد الذكي."
    >

    <meta
        name="theme-color"
        content="#100d0a"
    >

    <title>Story Hub</title>


    <!-- =========================================
         ملفات CSS
         ========================================= -->

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="interface.css">
    <link rel="stylesheet" href="buttons.css">
    <link rel="stylesheet" href="games.css">
    <link rel="stylesheet" href="effects.css">
    <link rel="stylesheet" href="ai-assistant.css">

</head>


<body>


    <!-- =========================================
         شاشة البداية
         ========================================= -->

    <section
        class="splash-screen"
        id="splashScreen"
    >

        <div class="splash-content">


            <!-- أيقونة التطبيق -->

            <div
                class="splash-icon"
                id="splashIcon"
            >
                🎮
            </div>


            <!-- اسم التطبيق -->

            <div
                class="splash-title"
                id="splashTitle"
            >
                Story Hub
            </div>


            <!-- Welcome -->

            <div
                class="splash-welcome"
                id="splashWelcome"
            >
                Welcome
            </div>


            <!-- مرحبًا -->

            <div
                class="splash-arabic"
                id="splashArabic"
            >
                مرحبًا
            </div>


        </div>

    </section>



    <!-- =========================================
         شاشة تسجيل الدخول والحساب
         ========================================= -->

    <section
        class="auth-screen"
        id="authScreen"
    >

        <div class="auth-card">


            <!-- شعار تسجيل الدخول -->

            <div class="auth-logo">
                🎮
            </div>


            <!-- العنوان -->

            <h1 id="authTitle">
                تسجيل الدخول
            </h1>


            <!-- الوصف -->

            <p id="authSubtitle">
                مرحبًا بك مرة أخرى في Story Hub
            </p>


            <!-- نموذج الحساب -->

            <form id="authForm">


                <!-- اسم المستخدم -->

                <div
                    class="auth-field"
                    id="usernameGroup"
                    style="display: none;"
                >

                    <label for="username">
                        اسم المستخدم
                    </label>

                    <input
                        type="text"
                        id="username"
                        autocomplete="username"
                        placeholder="اكتب اسم المستخدم"
                    >

                </div>



                <!-- البريد الإلكتروني -->

                <div class="auth-field">

                    <label for="email">
                        البريد الإلكتروني
                    </label>

                    <input
                        type="email"
                        id="email"
                        autocomplete="email"
                        placeholder="example@email.com"
                        required
                    >

                </div>



                <!-- كلمة المرور -->

                <div class="auth-field">

                    <label for="password">
                        كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="password"
                        autocomplete="current-password"
                        placeholder="••••••••"
                        required
                    >

                </div>



                <!-- رسائل النظام -->

                <div
                    class="auth-message"
                    id="authMessage"
                ></div>



                <!-- زر الدخول / التسجيل -->

                <button
                    class="auth-submit"
                    id="authSubmit"
                    type="submit"
                >
                    تسجيل الدخول
                </button>


            </form>



            <!-- تبديل الدخول والتسجيل -->

            <button
                class="auth-switch"
                id="authSwitch"
                type="button"
            >

                <span id="authSwitchText">
                    ليس لديك حساب؟ إنشاء حساب
                </span>

            </button>


        </div>

    </section>



    <!-- =========================================
         زر فتح وإغلاق القائمة
         ========================================= -->

    <button
        class="menu-toggle"
        id="menuToggle"
        type="button"
        aria-label="فتح وإغلاق القائمة"
        aria-expanded="true"
    >

        <span>‹</span>

    </button>



    <!-- =========================================
         القائمة الجانبية
         ========================================= -->

    <aside
        class="sidebar"
        id="sidebar"
    >


        <!-- شعار التطبيق -->

        <div class="app-logo">

            <div class="app-logo-icon">
                🎮
            </div>

            <span class="app-logo-text">
                Story Hub
            </span>

        </div>



        <!-- =====================================
             أزرار التنقل
             ===================================== -->

        <nav class="navigation">


            <!-- الصفحة الرئيسية -->

            <button
                class="nav-button active"
                data-page="home"
                type="button"
            >

                <span class="nav-icon">
                    🏠
                </span>

                <span class="nav-text">
                    الصفحة الرئيسية
                </span>

            </button>



            <!-- الألعاب -->

            <button
                class="nav-button"
                data-page="games"
                type="button"
            >

                <span class="nav-icon">
                    🎮
                </span>

                <span class="nav-text">
                    الألعاب
                </span>

            </button>



            <!-- تحديثات الألعاب -->

            <button
                class="nav-button"
                data-page="updates"
                type="button"
            >

                <span class="nav-icon">
                    🔄
                </span>

                <span class="nav-text">
                    تحديثات الألعاب
                </span>

            </button>



            <!-- آخر الأخبار -->

            <button
                class="nav-button"
                data-page="news"
                type="button"
            >

                <span class="nav-icon">
                    📰
                </span>

                <span class="nav-text">
                    آخر الأخبار
                </span>

            </button>


            <!-- الحساب -->

            <button
                class="nav-button"
                data-page="profile"
                type="button"
            >

                <span class="nav-icon">
                    👤
                </span>

                <span class="nav-text">
                    الحساب
                </span>

            </button>



            <!-- المساعد الذكي (مسؤول فقط) -->

            <button
                class="nav-button"
                data-page="ai"
                data-admin-only
                type="button"
                style="display:none;"
            >

                <span class="nav-icon">
                    🤖
                </span>

                <span class="nav-text">
                    المساعد الذكي
                </span>

            </button>


        </nav>


    </aside>



    <!-- =========================================
         المحتوى الرئيسي
         ========================================= -->

    <main
        class="main-content"
        id="mainContent"
    ></main>



    <!-- =========================================
         JavaScript
         ========================================= -->

    <script type="module" src="database.js"></script>
    <script type="module" src="auth.js"></script>
    <script type="module" src="games.js"></script>
    <script type="module" src="news.js"></script>
    <script type="module" src="admin.js"></script>
    <script type="module" src="users-admin.js"></script>
    <script type="module" src="ai-assistant.js"></script>
    <script type="module" src="buttons.js"></script>
    <script type="module" src="animations.js"></script>

</body>

</html>
